name: Mirror Helm charts
on:
  push:
  schedule:
    - cron: "0 0 * * 1" # Run at midnight every Monday
  workflow_dispatch:
env:
  GH_PAGES_URL: vladmirtxrx.github.io/nvidia-helm-mirror
  REGISTRY_SOURCE: https://helm.ngc.nvidia.com/nvidia/ai-dynamo/charts
permissions:
  contents: write
jobs:
  download:
    name: Download charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - uses: actions/setup-go@v5

      - uses: azure/setup-helm@v5
        id: install

      - name: Download all Helm charts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p charts/
          cd charts/
          helm pull https://helm.ngc.nvidia.com/nvidia/ai-dynamo/charts/modelexpress-0.6.0.tgz
          helm pull https://helm.ngc.nvidia.com/nvidia/ai-dynamo/charts/dynamo-platform-1.5.0.tgz
          cd .. && mv charts/index.yaml .
          helm repo index charts/ --url "https://$GH_PAGES_URL/charts"
      - name: "Commit changes"
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          git add .
          git commit -m "chore: update Helm charts" || true
          git push origin gh-pages
