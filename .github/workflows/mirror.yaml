name: Mirror Helm charts
on:
  push:
  schedule:
    - cron: "0 0 * * 1" # Run at midnight every Monday
  workflow_dispatch:
env:
  GH_PAGES_URL: vladmirtxrx.github.io/nvidia-helm-mirror
  REGISTRY_SOURCE: https://helm.ngc.nvidia.com/nvidia/ai-dynamo/charts
permissions:
  contents: write
jobs:
  download:
    name: Download charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - uses: actions/setup-go@v5

      - name: Install helm-mirror
        run: go install github.com/konstructio/helm-mirror@latest

      - name: Download all Helm charts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p charts
          helm-mirror "$REGISTRY_SOURCE" "$(pwd)/charts" --new-root-url "https://${{ env.GH_PAGES_URL }}" --verbose --chart-name dynamo-platform --chart-version 1.5.0
          helm-mirror "$REGISTRY_SOURCE" "$(pwd)/charts" --new-root-url "https://${{ env.GH_PAGES_URL }}" --verbose --chart-name modelexpress --chart-version 0.6.0
          mv charts/index.yaml .

      - name: "Commit changes"
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          git add .
          git commit -m "chore: update Helm charts" || true
          git push origin gh-pages
